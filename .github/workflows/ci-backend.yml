name: ImageService Backend CI

on:
  [push]

jobs:
  build-test-sonar:
    name: Build, Test, SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and Test
        run: mvn clean verify

      - name: SonarQube Scan
        if: github.event_name == 'push'
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: Morgenmufel
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey= Morgenmufel_ImageService \
            -Dsonar.organization= ${{env.SONAR_ORGANIZATION}} \
            -Dsonar.host.url =  ${{env.SONAR_HOST_URL}}\
            -Dsonar.login=${{ env.SONAR_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test-sonar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t hilt0n3/imageservice-backend:latest .

      - name: Push Docker image
        run: docker push hilt0n3/imageservice-backend:latest
